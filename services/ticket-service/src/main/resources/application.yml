server:
  port: 8084

spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:postgresql://localhost:5437/ticket_db
    username: ticket_user
    password: ticket_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    consumer:
      group-id: ticket-service
      auto-offset-reset: earliest

ticket-service:
  public-base-url: http://localhost:8084
